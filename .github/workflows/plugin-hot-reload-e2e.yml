name: Plugin hot reload e2e (P4c)

# Hot upgrade coordinator + real DSH 0.2.1-rc.5 Host reload e2e.
# Covers plan.md §6.4 (upgrade coordinator, snapshot recovery, reload/reset
# idempotency) and §6.5 (shared services and native-child disposal across
# generations) at the layer CI can actually drive: the Linux web Host.
# Desktop and external-CLI overwrite paths are explicitly out of scope here.
#
# No shared Actions cache restore/save: newly executed upstream code never
# receives a path to poison caches trusted by future default-branch jobs.

on:
  pull_request:
    paths:
      - '.github/workflows/plugin-hot-reload-e2e.yml'
      - 'src/lib/plugin-hot-upgrade-coordinator.js'
      - 'src/index.js'
      - 'cordis.patch.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tests/plugin-hot-upgrade-coordinator.test.js'
      - 'tests/plugin-hot-shared-services.e2e.test.js'
      - 'tests/plugin-hot-reload.e2e.test.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/plugin-hot-reload-e2e.yml'
      - 'src/lib/plugin-hot-upgrade-coordinator.js'
      - 'src/index.js'
      - 'cordis.patch.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: plugin-hot-reload-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DSH_SHA: b830ec950faba0a46dda564be3e2d854afed94f1

jobs:
  hot-reload-e2e:
    name: coordinator + real Host reload e2e (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Vision Router
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: dvr
      - name: Checkout immutable DSH 0.2.1-rc.5 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b830ec950faba0a46dda564be3e2d854afed94f1
          persist-credentials: false
          path: dsh-021-rc5
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.19.0
      - name: Materialize Vision Router package artifacts
        working-directory: dvr
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
          pnpm build:check
      - name: Install DSH dependencies
        working-directory: dsh-021-rc5
        env:
          CI: 'true'
          LEFTHOOK: '0'
        run: pnpm install --frozen-lockfile
      - name: Build exact Host runtime
        # `dsh web` boots the CLI through tsx, but package exports resolve to
        # each workspace package's built lib/ output; without this build the
        # typert loader cannot find lib/typert.host.js. Built without any
        # shared Actions cache: newly executed upstream code never receives a
        # path to poison caches trusted by future default-branch jobs.
        working-directory: dsh-021-rc5
        run: pnpm run build
      - name: Coordinator state machine unit tests
        working-directory: dvr
        run: node --test tests/plugin-hot-upgrade-coordinator.test.js
      - name: Shared services static + mock layer
        working-directory: dvr
        run: node --test tests/plugin-hot-shared-services.e2e.test.js
      - name: Real Host hot reload e2e (config-level upgrade/reset + snapshot recovery)
        working-directory: dsh-021-rc5
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-021-rc5
        run: node --test ../dvr/tests/plugin-hot-reload.e2e.test.js
      - name: Real Host shared services e2e (unrelated plugin + native child across reloads)
        working-directory: dsh-021-rc5
        env:
          DSH_SOURCE_ROOT: ${{ github.workspace }}/dsh-021-rc5
        run: node --test ../dvr/tests/plugin-hot-shared-services.e2e.test.js
